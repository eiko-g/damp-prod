<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/default
    php_admin_value open_basedir "/var/www/html/default"
    <Directory /var/www/html/default>
        # AllowOverride all
        Order deny,allow
        Deny from all
        Allow from 127.0.0.1
    </Directory>
</VirtualHost>

